  <script src="assets/js/catalog.js"></script>
  <script>
    // One "Continue where I left off" button, shown only for unfinished work with real progress:
    // a test with at least one answer, a practice set with at least one answer, or Learn part-way done.
    // Just opening a page, or a test with nothing answered yet, does not count.
    (function () {
      function get(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
      // A staged number-line answer is an object: "started" once any box is filled, "answered" when all are.
      var LINE_PARTS = ['lo', 'hi', 'mid', 'pick'];
      function filled(r, k) { return r[k] !== undefined && r[k] !== null && String(r[k]).trim() !== ''; }
      function answered(r, started) {
        if (r && typeof r === 'object' && !Array.isArray(r)) return started ? LINE_PARTS.concat('why').some(function (k) { return filled(r, k); }) : LINE_PARTS.concat(r.needWhy ? ['why'] : []).every(function (k) { return filled(r, k); });
        return r !== undefined && r !== '' && r !== null && !(Array.isArray(r) && r.every(function (v) { return v === '' || v === 0 || v === null; }));
      }
      // Continue appears once anything has been typed; the label counts fully answered questions (as the test does).
      function count(responses, started) { return Object.keys(responses || {}).filter(function (k) { return answered(responses[k], started); }).length; }
      var found = [];
      // Each lesson keeps its own progress (its own storage prefix). The list of lessons lives in assets/js/catalog.js.
      Mathbook.catalog.lessons.forEach(function (lesson) {
        var key = lesson.key;
        var page = lesson.path;
        lesson.tests.forEach(function (t) {
          var d = get(key + 'draft-' + t[0]);
          var n = d && d.questions ? count(d.responses) : 0;
          if (d && d.questions && count(d.responses, true)) found.push({ href: page + '#test/' + t[0], what: 'Lesson ' + lesson.id + ' · ' + t[1] + ': ' + n + ' of ' + d.questions.length + ' answered' });
        });
        var bank = get(key + 'bank-sets') || {};
        Object.keys(bank).forEach(function (id) {
          var a = bank[id] && bank[id].active;
          var n = a && !a.checked ? count(a.responses) : 0;
          if (a && !a.checked && count(a.responses, true)) found.push({ href: page + '#practice/' + id, what: 'Lesson ' + lesson.id + ' · Practice on my own: ' + n + ' of ' + a.order.length + ' answered' });
        });
        var w = get(key + 'see-wizard');
        var done = w && w.done ? Object.keys(w.done).length : 0;
        if (w && (done || w.step) && done < lesson.steps) found.push({ href: page + '#see', what: 'Lesson ' + lesson.id + ' · Learn: step ' + ((w.step || 0) + 1) + ' of ' + lesson.steps });
      });
      var nw = get('mathbook:v2:number-words:phase-1:draft');
      var nwn = nw && nw.questions ? count(nw.responses) : 0;
      if (nw && nw.questions && count(nw.responses, true)) found.push({ href: 'number-words/phase-1/#test', what: 'Number Words · Spelling test: ' + nwn + ' of ' + nw.questions.length + ' answered' });
      if (!found.length) return;
      // Prefer the screen that was open most recently, if it is one of these.
      var act = get('mathbook:v2:activity');
      var pick = found[0];
      // Best: the same lesson and the same screen (e.g. #test and #test/rounding); next best: the same lesson.
      if (act && act.path) {
        var page = function (p) { return p.split('#')[0]; };
        var screen = function (p) { return (p.split('#')[1] || '').split('/')[0]; };
        var samePage = found.filter(function (f) { return page(f.href) === page(act.path); });
        var sameScreen = samePage.filter(function (f) { return screen(f.href) === screen(act.path); });
        pick = sameScreen[0] || samePage[0] || pick;
      }
      document.getElementById('continue-link').href = pick.href;
      document.getElementById('continue-what').textContent = pick.what;
      document.getElementById('continue').hidden = false;
    })();
  </script>
</body>
