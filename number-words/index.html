<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Words · Mathbook</title>
  <meta name="description" content="Number Words: Read It, Say It, Spell It, Write It. Read and spell number words from zero to 9,999, in four phases.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/mathbook.css">
</head>
<body>
  <a class="skip" href="#phases">Skip to phases</a>
  <header class="topbar"><div class="topbar-in">
    <a class="brand" href="../">
      <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><circle cx="20" cy="20" r="11" fill="#ffc94d"/><circle cx="16" cy="16" r="4" fill="#ffe39a"/><ellipse cx="20" cy="21" rx="18" ry="6" fill="none" stroke="#b9a8ff" stroke-width="2.6" transform="rotate(-18 20 20)"/><circle cx="34" cy="7" r="1.8" fill="#fff"/><circle cx="6" cy="33" r="1.2" fill="#fff"/></svg>
      <span>Mathbook</span>
    </a>
    <span class="crumbs">Number Words</span>
    <span class="topbar-right"><a class="home-link" href="../">Home</a></span>
  </div></header>

  <main class="stage stage-menu" id="main">
    <section class="hero menu-hero">
      <p class="eyebrow">Read It, Say It, Spell It, Write It</p>
      <h1>Number Words</h1>
      <p class="lead">Choose the numbers you want to learn.</p>
    </section>

    <nav class="nw-phase-grid" id="phases" aria-label="Number Words phases"></nav>
    <p class="parent-link"><a href="parent/">Parent Guide</a> <span class="muted">· how each phase works</span></p>
  </main>
  <footer class="footer"><p>Mathbook · Original learning content · Progress is saved in this browser only.</p></footer>

  <script src="../assets/js/place-value.js"></script>
  <script src="program.js"></script>
  <script>
    (function () {
      var P = Mathbook.numberWords.program;
      function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      // One compact card per phase: title, one line, Open (always at the bottom of the card).
      document.getElementById('phases').innerHTML = P.phases.map(function (ph) {
        return '<section class="nw-phase" aria-labelledby="ph' + ph.id + '-title"><p class="nw-phase-tag">Phase ' + esc(ph.id) + '</p>' +
          '<h2 id="ph' + ph.id + '-title">' + esc(ph.title) + '</h2><p class="nw-phase-desc">' + esc(ph.card) + '</p>' +
          '<a class="btn btn-primary" href="' + esc(ph.href) + '">Open<span class="sr-only">: ' + esc(ph.title) + '</span></a></section>';
      }).join('');
    })();
  </script>
</body>
</html>
